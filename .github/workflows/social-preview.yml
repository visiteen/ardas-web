name: Social Preview

on:
  push:
    paths:
      - .github/workflows/social-preview.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-social-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - run: python scripts/social_preview.py
      - name: Commit generated preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html og-image.png
          git diff --cached --quiet && exit 0
          git commit -m "Enable ARDAS logo in social link previews"
          git push
